<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 160" role="img" aria-labelledby="title">
  <title id="title">Renault Nissan</title>
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e6e6e6"/>
      <stop offset="100%" stop-color="#a5a5a5"/>
    </linearGradient>
  </defs>
  <rect width="500" height="160" fill="transparent"/>
  <g transform="translate(40 20)">
    <polygon points="80,0 160,80 80,160 0,80" fill="url(#grad)" stroke="#777" stroke-width="5"/>
    <polygon points="80,15 145,80 80,145 15,80" fill="#fff"/>
  </g>
  <g transform="translate(220 40)">
    <text x="0" y="38" font-family="Arial, Helvetica, sans-serif" font-size="42" font-weight="700" fill="#111">Renault</text>
    <text x="0" y="86" font-family="Arial, Helvetica, sans-serif" font-size="32" fill="#555">Nissan</text>
  </g>
</svg>
