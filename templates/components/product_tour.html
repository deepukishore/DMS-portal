<div class="product-tour" id="product-tour" hidden aria-hidden="true">
  <div class="product-tour-backdrop product-tour-backdrop-top" aria-hidden="true"></div>
  <div class="product-tour-backdrop product-tour-backdrop-right" aria-hidden="true"></div>
  <div class="product-tour-backdrop product-tour-backdrop-bottom" aria-hidden="true"></div>
  <div class="product-tour-backdrop product-tour-backdrop-left" aria-hidden="true"></div>
  <div class="product-tour-highlight" aria-hidden="true"></div>
  <section class="product-tour-popover" role="dialog" aria-modal="true" aria-labelledby="product-tour-title" aria-describedby="product-tour-description">
    <div class="product-tour-head">
      <span class="product-tour-progress" id="product-tour-progress"></span>
      <button type="button" class="product-tour-close" id="product-tour-close" aria-label="Close product tour">&times;</button>
    </div>
    <h2 id="product-tour-title"></h2>
    <p id="product-tour-description"></p>
    <div class="product-tour-footer">
      <button type="button" class="product-tour-skip" id="product-tour-skip">Skip tour</button>
      <div class="product-tour-actions">
        <button type="button" class="btn-outline" id="product-tour-previous">Previous</button>
        <button type="button" class="btn-primary" id="product-tour-next">Next</button>
      </div>
    </div>
  </section>
</div>
